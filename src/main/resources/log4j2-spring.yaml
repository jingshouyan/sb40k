Configuration:
  status: WARN
  monitorInterval: 30

  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %c{1.} - %msg%n"

    RollingFile:
      name: File
      fileName: logs/sb40k.log
      filePattern: logs/sb40k-%d{yyyy-MM-dd}-%i.log.gz
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %c{1.} - %msg%n"
      Policies:
        TimeBasedTriggeringPolicy: {}
        SizeBasedTriggeringPolicy:
          size: 100 MB
      DefaultRolloverStrategy:
        max: 100
        Delete:
          basePath: logs
          maxDepth: 1
          IfLastModified:
            age: 7d

  Loggers:
    AsyncRoot:
      level: warn
      AppenderRef:
        - ref: File
        - ref: Console

    AsyncLogger:
      - name: com.github.jingshouyan.sb40k
        level: debug
        additivity: false
        AppenderRef:
          - ref: File
          - ref: Console
