spring:
  application:
    name: sb40k

  datasource:
    url: jdbc:mysql://localhost:3306/sb40db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: abcd1234
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: com.github.jingshouyan.sb40k.config.MyNamingStrategy
      ddl-auto: update
      globally_quoted_identifiers: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    enable: false
    enable-csrf: false
    user:
      name: admin
      password: admin123

server:
  port: 8081


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

socketio:
  port: 8080

biz:
  mask-settings:
    password: 22